[project]
name = "hanzisave-ml"
version = "0.1.0"
description = "Chinese sentence-difficulty classifier: data construction, baselines, fine-tuning, evaluation"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "huggingface-hub>=0.25",
    "jieba>=0.42",
    "opencc-python-reimplemented>=0.1.7",
    "pandas>=2.2",
    "pyarrow>=17",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
]

[project.optional-dependencies]
train = [
    "torch>=2.3",
    "transformers>=4.44",
    "accelerate>=0.33",
]
llm = [
    "anthropic>=0.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hanzisave_ml"]
